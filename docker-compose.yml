services:
  terboro:
    image: ghcr.io/robertorincos/terboro:latest
    container_name: terboro_site
    ports:
      - "82:80"
    restart: always
    environment:
      - NODE_ENV=production
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true